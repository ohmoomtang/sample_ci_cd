name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Install node.js version 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install required npm dependencies
        run: npm install
      - name: Run test
        run: npm test
  build:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/demo-app:latest
            ghcr.io/${{ github.actor }}/demo-app:${{ github.sha }}
  update-manifest:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    if: github.event_name == 'push'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Change deployment to point to latest SHA
        run: sed -i 's|demo-app:.*|demo-app:${{ github.sha }}|' k8s/deployment.yaml
      - name: Commit and push back to repository
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add .
          git commit -m "Revise Docker Image tag for CD"
          git push
