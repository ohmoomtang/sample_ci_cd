apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app
  namespace: default
spec:
  replicas: 5
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: ghcr.io/ohmoomtang/demo-app:fba3a7ca1e5ba4c055bad3fe5f620712fdf6d20d
          ports:
            - containerPort: 3000
  strategy:
    canary:
      canaryService: demo-app-canary
      stableService: demo-app
      trafficRouting:
        nginx:
          stableIngress: demo-app
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
